plugins {
    id 'com.android.application'
}

android {
    namespace 'org.sincompat.screenprobe'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.sincompat.screenprobe'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-phase104'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DSIN_BUILD_ANDROID_SCREEN_PROBE=ON',
                          '-DSIN_BUILD_ANDROID_SMOKE=OFF',
                          '-DBUILD_TESTING=OFF',
                          '-DANDROID_STL=c++_static'
                targets 'sin_android_screen_probe'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
