name: SiN independent PE32 slot-zero runtime boundary
on:
  push:
    branches:
      - 'feature/sin-win32-owner-startup-verdict-phase294-20261117'
    paths:
      - 'pc/independent_slot0/**'
      - '.github/workflows/sin-win32-independent-slot0.yml'
  pull_request:
    paths:
      - 'pc/independent_slot0/**'
      - '.github/workflows/sin-win32-independent-slot0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-pe32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate original-free SiN DynamicDifficulty callback registration audit
        run: python research/tests/test_sin_client_dynamic_difficulty_init.py
      - name: Validate original-free SiN constructor game-system RTTI audit
        run: python research/tests/test_sin_client_constructed_gamesystems.py
      - name: Validate original-free SiN static game-system RTTI audit
        run: python research/tests/test_sin_client_static_gamesystem_rtti.py
      - name: Validate original-free SiN ClientShadowMgr Init audit
        run: python research/tests/test_sin_client_shadow_mgr_init.py
      - name: Validate original-free SiN Stats 66-record catalog audit
        run: python research/tests/test_sin_client_stats_catalog.py
      - name: Validate original-free SiN Stats definition factory RTTI audit
        run: python research/tests/test_sin_client_stats_definition_types.py
      - name: Validate original-free SiN Stats storage helper audit
        run: python research/tests/test_sin_client_stats_storage.py
      - name: Validate original-free SiN StatsSystem Init audit
        run: python research/tests/test_sin_client_stats_system_init.py
      - name: Validate original-free SiN auto-game-system Init audit
        run: python research/tests/test_sin_client_auto_gamesystem_init.py
      - name: Validate original-free SiN HUD converter ABI audit
        run: python research/tests/test_sin_client_hud_converter_native.py
      - name: Validate original-free VEngineVGui001 PE parser
        run: python research/tests/test_sin_client_engine_vgui_slot1.py
      - name: Configure native MSVC Win32
        run: cmake -S pc/independent_slot0 -B build-slot0 -G "Visual Studio 17 2022" -A Win32
      - name: Build non-forwarding DLLs and ABI tests
        run: cmake --build build-slot0 --config Release --parallel
      - name: Run actual PE32 loader and slot0 tests
        run: ctest --test-dir build-slot0 -C Release --output-on-failure
      - name: Verify PE32 architecture and reject original-DLL forwarding imports
        shell: pwsh
        run: |
          @'
          import pathlib, struct
          for name in ('client.dll','server.dll'):
              path=pathlib.Path('build-slot0/bin/Release')/name
              b=path.read_bytes()
              assert b[:2]==b'MZ'
              pe=struct.unpack_from('<I',b,0x3c)[0]
              assert b[pe:pe+4]==b'PE\0\0'
              assert struct.unpack_from('<H',b,pe+4)[0]==0x14c
              assert struct.unpack_from('<H',b,pe+24)[0]==0x10b
              assert b'sin_original_client.dll' not in b.lower()
              assert b'sin_original_server.dll' not in b.lower()
              print('PASS independent PE32:',name)
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: sin-independent-pe32-slot0-diagnostic-not-playable
          path: |
            build-slot0/bin/Release/client.dll
            build-slot0/bin/Release/server.dll
          if-no-files-found: error
          retention-days: 7
      - name: Package owner-original InterfaceReg factory ABI readback (original game binaries not included)
        shell: pwsh
        run: |
          $bundle = New-Item -ItemType Directory -Path owner-original-interface-factory-probe
          $bin = 'build-slot0/bin/Release'
          Copy-Item "$bin/sin_original_interfacereg_owner_probe.exe" $bundle
          Copy-Item 'pc/independent_slot0/Run-OwnerOriginalInterfaceFactoryProbe.ps1', 'pc/independent_slot0/OwnerOriginalInterfaceFactoryProbe-README.txt' $bundle
          $tokens=$null
          $errors=$null
          $runner = Join-Path $bundle.FullName 'Run-OwnerOriginalInterfaceFactoryProbe.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($runner,[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          & $runner -SelfTest
          if (-not $?) { throw 'Owner-only original factory package self-test failed' }
          if (-not (Test-Path (Join-Path $bundle.FullName 'sin_original_interfacereg_owner_probe.exe'))) { throw 'Missing owner-only Win32 probe' }
          if ((Get-ChildItem $bundle -File).Count -ne 3) { throw 'Owner-only package includes unexpected files' }
      - uses: actions/upload-artifact@v4
        with:
          name: SiN-Owner-Original-InterfaceFactory-Probe-Win32-NO-GAME-DLLs
          path: owner-original-interface-factory-probe/
          if-no-files-found: error
          retention-days: 14
      - name: Package original weapon-policy owner audit
        shell: pwsh
        run: |
          $bundle = New-Item -ItemType Directory -Path owner-weapon-policy-audit
          $bin = 'build-slot0/bin/Release'
          Copy-Item "$bin/server.dll", "$bin/sin_server_npc_weapon_ammo_audit.exe", "$bin/sin_server_npc_weapon_melee_audit.exe" $bundle
          Copy-Item 'pc/independent_slot0/Run-OwnerWeaponPolicyAudit.ps1', 'pc/independent_slot0/Run-OwnerWeaponPolicyAudit.cmd', 'pc/independent_slot0/OwnerWeaponPolicyAudit-README.txt' $bundle
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $bundle.FullName 'Run-OwnerWeaponPolicyAudit.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          & (Join-Path $bundle.FullName 'Run-OwnerWeaponPolicyAudit.ps1') -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item (Join-Path $bundle.FullName 'weapon-policy-audit.log')
      - uses: actions/upload-artifact@v4
        with:
          name: SiN-Owner-Weapon-Policy-Differential-Win32
          path: owner-weapon-policy-audit/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare self-contained owner diagnostic bundle
        shell: pwsh
        run: |
          python pc/independent_slot0/Build-OwnerDiagnosticBundle.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python pc/independent_slot0/Build-OwnerDiagnosticBundle.py --bin build-slot0/bin/Release --output owner-diagnostic-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'owner-diagnostic-bundle/Run-ClientCvarDiagnostic.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          & pc/independent_slot0/Test-OwnerClientDiagnosticBundle.ps1 -Wrapper owner-diagnostic-bundle/Run-ClientCvarDiagnostic.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sin-owner-client-cvar-diagnostic-bundle-not-playable
          path: owner-diagnostic-bundle/
          if-no-files-found: error
          retention-days: 7
      - name: Package reversible original-engine client-only startup boundary
        shell: pwsh
        run: |
          python pc/independent_slot0/Build-OwnerDiagnosticBundle.py --bin build-slot0/bin/Release --output owner-client-startup-boundary --client-startup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'owner-client-startup-boundary/Run-OwnerClientStartupBoundary.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          & pc/independent_slot0/Test-OwnerClientStartupBoundary.ps1 -Wrapper owner-client-startup-boundary/Run-OwnerClientStartupBoundary.ps1
          if (-not $?) { throw 'Client startup boundary bundle synthetic test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: sin-owner-client-startup-boundary-not-playable
          path: owner-client-startup-boundary/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare owner filesystem presence-first diagnostic bundle
        shell: pwsh
        run: |
          python pc/independent_slot0/Build-OwnerDiagnosticBundle.py --bin build-slot0/bin/Release --output owner-filesystem-bundle --filesystem
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'owner-filesystem-bundle/Invoke-OwnerFileSystemRetailGate.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          & pc/independent_slot0/Test-OwnerFileSystemRetailGate.ps1 -Gate owner-filesystem-bundle/Invoke-OwnerFileSystemRetailGate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: sin-owner-filesystem-presence-read-bundle-not-playable
          path: owner-filesystem-bundle/
          if-no-files-found: error
          retention-days: 7
      - name: Assemble standalone one-click Windows filesystem test
        shell: pwsh
        run: |
          python pc/independent_slot0/Build-OwnerDiagnosticBundle.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python pc/independent_slot0/Build-OwnerDiagnosticBundle.py --bin build-slot0/bin/Release --output standalone-filesystem-test --one-click
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pc/independent_slot0/Test-SiNOneClickPackage.ps1 -Runner standalone-filesystem-test/Start-SiNFileSystemTest.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'standalone-filesystem-test/Start-SiNFileSystemTest.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
      - uses: actions/upload-artifact@v4
        with:
          name: SiN-Episodes-Standalone-OneClick-Filesystem-Test-Win32
          path: standalone-filesystem-test/
          if-no-files-found: error
          retention-days: 14
