name: C++ reference CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Test research PE metadata verifier (synthetic fixtures)
        run: python3 -m unittest discover -s research/tests -p 'test_*.py' -v
      - name: Check freestanding Android ARM64 C ABI layout (not an NDK build)
        run: bash scripts/check_android_abi_layout.sh
