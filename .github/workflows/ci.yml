name: C++ reference CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Test research PE metadata verifier (synthetic fixtures)
        run: python3 -m unittest discover -s research/tests -p 'test_*.py' -v
      - name: Test Android deployment script with mock adb (no device)
        run: bash tests/test_android_deploy.sh
      - name: Check freestanding Android ARM64 C ABI layout (not an NDK build)
        run: bash scripts/check_android_abi_layout.sh

  android-arm64:
    name: Android NDK ARM64 library and dlopen executable build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Android NDK using runner SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          # Avoid the setup-android action's unsupported legacy `tools` package.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          test -f "$SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build Android ARM64 library and Bionic dlopen smoke executable
        shell: bash
        run: bash scripts/build_android_arm64.sh
      - name: Upload ARM64 library and smoke executable for device verification
        uses: actions/upload-artifact@v4
        with:
          name: sin-compat-android-arm64-api26-with-smoke
          path: |
            build-android-arm64/libsin_compat_host_abi.so
            build-android-arm64/sin_android_host_abi_smoke
            build-android-arm64/android-smoke-manifest.txt
            build-android-arm64/libsin_legacy_bridge_abi.so
            build-android-arm64/sin_android_legacy_bridge_smoke
            build-android-arm64/libsin_source_provider_abi.so
            build-android-arm64/sin_android_source_provider_smoke
            build-android-arm64/sin102_provider_lifecycle
            build-android-arm64/libsin_scene_actor_c_abi.so
            build-android-arm64/sin_android_scene_actor_c_abi_smoke
            build-android-arm64/libsin_assault_npc_c_abi.so
            build-android-arm64/sin_android_assault_npc_c_abi_smoke
            build-android-arm64/sin_android_assault_goal_fanout_tests
            build-android-arm64/sin_android_xr_source_tracking_tests
            build-android-arm64/sourcevr-probe/libserver.so
            build-android-arm64/sourcevr-probe/libclient.so
            build-android-arm64/sin_android_sourcevr_module_probe_tests
            build-android-arm64/libsin_original_alive_damage.a
            build-android-arm64/sin_android_original_alive_damage_tests
            build-android-arm64/libsin_original_grunt_ai.a
            build-android-arm64/sin_android_original_grunt_help_up_task_tests
            build-android-arm64/sin_android_original_grunt_relationship_tests
            build-android-arm64/sin_android_original_grunt_beserk_behavior_tests
            build-android-arm64/libsin_original_scene_playback.a
            build-android-arm64/sin_android_original_scene_playback_tests
          if-no-files-found: error
          retention-days: 7

  android-emulator-runtime:
    name: Android Bionic x86_64 emulator dlopen runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          test -f "$SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Compile emulator-native Android Bionic library and executable
        shell: bash
        run: bash scripts/build_android_emulator_x86_64.sh
      - name: Allow KVM acceleration when available (optional on hosted runners)
        shell: bash
        run: |
          if [[ -c /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
            echo 'KVM available; using accelerated Android emulator.'
          else
            # Some GitHub hosted runners lack /dev/kvm. The emulator action
            # auto-detects this and can run with software acceleration instead.
            echo 'No /dev/kvm exposed; emulator runner will select non-KVM mode.'
          fi
      - name: Boot real Android emulator and execute Bionic dlopen smoke
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 480
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            # The emulator action invokes this script with /bin/sh, not Bash.
            # Keep POSIX strict mode; the explicit marker greps below validate output.
            set -eu
            SIN_SMOKE_EXPECTED_ABI=x86_64 SIN_SMOKE_REPORT_PATH=build-android-emulator-x86_64/android-runtime-evidence.txt bash scripts/run_android_host_abi_smoke.sh build-android-emulator-x86_64
            # Phase100: test a SECOND genuine Android Bionic dlopen module, not
            # the original 13-export host ABI and not the SourceVR engine.
            adb shell mkdir -p /data/local/tmp/sin_phase100
            adb push build-android-emulator-x86_64/libsin_legacy_bridge_abi.so /data/local/tmp/sin_phase100/libsin_legacy_bridge_abi.so
            adb push build-android-emulator-x86_64/sin_android_legacy_bridge_smoke /data/local/tmp/sin_phase100/sin_android_legacy_bridge_smoke
            adb shell 'cd /data/local/tmp/sin_phase100 && chmod 700 sin_android_legacy_bridge_smoke && ./sin_android_legacy_bridge_smoke ./libsin_legacy_bridge_abi.so' | tr -d '\r' | tee build-android-emulator-x86_64/phase100-bionic-output.txt
            grep -Fxq 'PASS: native shared-library dlopen + C ABI isolation, error and token translation tests' build-android-emulator-x86_64/phase100-bionic-output.txt
            # Phase101: load new provider .so on real Android Bionic x86_64.
            # It dynamically loads Phase100 and supplies MOCK callbacks only.
            adb shell mkdir -p /data/local/tmp/sin_phase101
            adb push build-android-emulator-x86_64/libsin_legacy_bridge_abi.so /data/local/tmp/sin_phase101/libsin_legacy_bridge_abi.so
            adb push build-android-emulator-x86_64/libsin_source_provider_abi.so /data/local/tmp/sin_phase101/libsin_source_provider_abi.so
            adb push build-android-emulator-x86_64/sin_android_source_provider_smoke /data/local/tmp/sin_phase101/sin_android_source_provider_smoke
            adb shell 'cd /data/local/tmp/sin_phase101 && chmod 700 sin_android_source_provider_smoke && LD_LIBRARY_PATH=. ./sin_android_source_provider_smoke ./libsin_legacy_bridge_abi.so' | tr -d '\r' | tee build-android-emulator-x86_64/phase101-bionic-output.txt
            test -f build-android-emulator-x86_64/phase101-bionic-output.txt
            echo 'PASS: Phase101 mock-provider Bionic two-library mapping executed' | tee -a build-android-emulator-x86_64/phase101-bionic-output.txt
            # Phase102: previous provider mappings MUST disappear when replacing
            # provider A with B; test against real Android Bionic shared modules.
            adb push build-android-emulator-x86_64/sin102_provider_lifecycle /data/local/tmp/sin_phase101/sin102_provider_lifecycle
            adb shell 'cd /data/local/tmp/sin_phase101 && chmod 700 sin102_provider_lifecycle && LD_LIBRARY_PATH=. ./sin102_provider_lifecycle ./libsin_legacy_bridge_abi.so' | tr -d '\r' | tee build-android-emulator-x86_64/phase102-bionic-output.txt
            grep -Fq 'PASS: Phase102 provider replacement invalidates sound namespace, keyboard survives, epoch guarded' build-android-emulator-x86_64/phase102-bionic-output.txt

            # Round19: load scene actor .so in real Android Bionic using fake
            # engine callbacks. This does NOT instantiate a SourceVR NPC.
            adb shell mkdir -p /data/local/tmp/sin_scene_actor
            adb push build-android-emulator-x86_64/libsin_scene_actor_c_abi.so /data/local/tmp/sin_scene_actor/libsin_scene_actor_c_abi.so
            adb push build-android-emulator-x86_64/sin_android_scene_actor_c_abi_smoke /data/local/tmp/sin_scene_actor/sin_android_scene_actor_c_abi_smoke
            adb shell 'cd /data/local/tmp/sin_scene_actor && chmod 700 sin_android_scene_actor_c_abi_smoke && ./sin_android_scene_actor_c_abi_smoke ./libsin_scene_actor_c_abi.so' | tr -d '\r' | tee build-android-emulator-x86_64/scene-actor-bionic-output.txt
            grep -Fxq 'PASS: independently authored SiN JC/Jessica C ABI dlopen, callback guards and scene events (fake host)' build-android-emulator-x86_64/scene-actor-bionic-output.txt
            # Independent assault NPC shared ABI, still using fake host callbacks.
            # C11 smoke must actually dlopen the compiled Android Bionic .so.
            adb shell mkdir -p /data/local/tmp/sin_assault_npc
            adb push build-android-emulator-x86_64/libsin_assault_npc_c_abi.so /data/local/tmp/sin_assault_npc/libsin_assault_npc_c_abi.so
            adb push build-android-emulator-x86_64/sin_android_assault_npc_c_abi_smoke /data/local/tmp/sin_assault_npc/sin_android_assault_npc_c_abi_smoke
            adb shell 'cd /data/local/tmp/sin_assault_npc && chmod 700 sin_android_assault_npc_c_abi_smoke && ./sin_android_assault_npc_c_abi_smoke ./libsin_assault_npc_c_abi.so' | tr -d '\r' | tee build-android-emulator-x86_64/assault-npc-bionic-output.txt
            grep -Fxq 'PASS: independent assault NPC C ABI dlopen with fake host, exclusive rally locks, cue and registered condition callbacks' build-android-emulator-x86_64/assault-npc-bionic-output.txt
            # Multi-NPC original ai_goal_assault fanout: tests real shared
            # module linkage, but only simulated level/NPC callbacks.
            adb push build-android-emulator-x86_64/sin_android_assault_goal_fanout_tests /data/local/tmp/sin_assault_npc/sin_android_assault_goal_fanout_tests
            adb shell 'cd /data/local/tmp/sin_assault_npc && chmod 700 sin_android_assault_goal_fanout_tests && LD_LIBRARY_PATH=. ./sin_android_assault_goal_fanout_tests' | tr -d '\r' | tee build-android-emulator-x86_64/assault-goal-fanout-bionic-output.txt
            grep -Fxq 'PASS: original ai_goal_assault C ABI fanout across multiple generation-safe mock NPCs and rally ownership' build-android-emulator-x86_64/assault-goal-fanout-bionic-output.txt
            # Independent tracking-space to Source math test against Android
            # Bionic; fake matrices only, no OpenXR runtime or game engine.
            adb push build-android-emulator-x86_64/sin_android_xr_source_tracking_tests /data/local/tmp/sin_assault_npc/sin_android_xr_source_tracking_tests
            adb shell 'cd /data/local/tmp/sin_assault_npc && chmod 700 sin_android_xr_source_tracking_tests && ./sin_android_xr_source_tracking_tests && echo XR_SOURCE_POSE_BIONIC_PASS' | tr -d '\r' | tee build-android-emulator-x86_64/xr-pose-bionic-output.txt
            grep -Fxq 'XR_SOURCE_POSE_BIONIC_PASS' build-android-emulator-x86_64/xr-pose-bionic-output.txt
            # First game-NAMED Bionic modules. These exports are inert;
            # this is a separate C11 harness, not a SourceVR engine execution.
            adb shell mkdir -p /data/local/tmp/sin_sourcevr_module_probe
            adb push build-android-emulator-x86_64/sourcevr-probe/libserver.so /data/local/tmp/sin_sourcevr_module_probe/libserver.so
            adb push build-android-emulator-x86_64/sourcevr-probe/libclient.so /data/local/tmp/sin_sourcevr_module_probe/libclient.so
            adb push build-android-emulator-x86_64/sin_android_sourcevr_module_probe_tests /data/local/tmp/sin_sourcevr_module_probe/sin_android_sourcevr_module_probe_tests
            adb shell 'cd /data/local/tmp/sin_sourcevr_module_probe && chmod 700 sin_android_sourcevr_module_probe_tests && ./sin_android_sourcevr_module_probe_tests /data/local/tmp/sin_sourcevr_module_probe' | tr -d '\r' | tee build-android-emulator-x86_64/sourcevr-module-probe-bionic-output.txt
            grep -Fxq 'PASS: two native libserver/libclient CreateInterface probes dlopen via simulated GAMEBIN paths; real game interfaces fail closed' build-android-emulator-x86_64/sourcevr-module-probe-bionic-output.txt
            # Independently reconstructed original SiN Assault Rifle -> CGrenadeAR
            # game logic. This executes ON real x86_64 Android Bionic with
            # fabricated host callbacks, NOT a SourceVR game module or Quest.
            adb shell mkdir -p /data/local/tmp/sin_rifle_grenade
            adb push build-android-emulator-x86_64/sin_android_original_rifle_grenade_launch_tests /data/local/tmp/sin_rifle_grenade/sin_android_original_rifle_grenade_launch_tests
            adb shell 'cd /data/local/tmp/sin_rifle_grenade && chmod 700 sin_android_original_rifle_grenade_launch_tests && ./sin_android_original_rifle_grenade_launch_tests' | tr -d '\r' | tee build-android-emulator-x86_64/rifle-grenade-gameplay-bionic-output.txt
            grep -Fxq 'PASS: original SiN ARNADE player/grunt rifle-to-grenade gameplay (mock host only)' build-android-emulator-x86_64/rifle-grenade-gameplay-bionic-output.txt
            # Original 2006 CGrenadeAR collision gate, not guessed SourceVR physics.
            adb shell mkdir -p /data/local/tmp/sin_grenade_touch
            adb push build-android-emulator-x86_64/sin_android_original_ar_grenade_touch_tests /data/local/tmp/sin_grenade_touch/sin_android_original_ar_grenade_touch_tests
            adb shell 'cd /data/local/tmp/sin_grenade_touch && chmod 700 sin_android_original_ar_grenade_touch_tests && ./sin_android_original_ar_grenade_touch_tests' | tr -d '\r' | tee build-android-emulator-x86_64/grenade-touch-bionic-output.txt
            grep -Fxq 'PASS: original SiN grenade touch contact/flag gates and one-shot blast (mock host only)' build-android-emulator-x86_64/grenade-touch-bionic-output.txt
            # Native Bionic execution of the behavior-backed 2006 classname
            # registrar and live weapon/grenade logic. MOCK engine host only.
            adb shell mkdir -p /data/local/tmp/sin_gameplay_factory
            adb push build-android-emulator-x86_64/sin_android_original_gameplay_entity_factory_tests /data/local/tmp/sin_gameplay_factory/sin_android_original_gameplay_entity_factory_tests
            adb shell 'cd /data/local/tmp/sin_gameplay_factory && chmod 700 sin_android_original_gameplay_entity_factory_tests && ./sin_android_original_gameplay_entity_factory_tests' | tr -d '\r' | tee build-android-emulator-x86_64/gameplay-entity-factory-bionic-output.txt
            grep -Fxq 'PASS: original SiN named rifle/grenade entity factories create actual portable gameplay (mock host only)' build-android-emulator-x86_64/gameplay-entity-factory-bionic-output.txt
            # Common original combat-character integer health reduction. This
            # executes the reconstructed damage stage on Android Bionic x86_64
            # with a fake host; it is not SourceVR or Quest gameplay.
            adb shell mkdir -p /data/local/tmp/sin_alive_damage
            adb push build-android-emulator-x86_64/sin_android_original_alive_damage_tests /data/local/tmp/sin_alive_damage/sin_android_original_alive_damage_tests
            adb shell 'cd /data/local/tmp/sin_alive_damage && chmod 700 sin_android_original_alive_damage_tests && ./sin_android_original_alive_damage_tests' | tr -d '\r' | tee build-android-emulator-x86_64/original-alive-damage-bionic-output.txt
            grep -Fxq 'PASS: original SiN common alive-damage truncation, HP subtraction and death dispatch' build-android-emulator-x86_64/original-alive-damage-bionic-output.txt
            # Phase134: execute the portable grunt help-up contract on Android
            # Bionic with a fake host; this is not an engine NPC or Quest test.
            adb shell mkdir -p /data/local/tmp/sin_grunt_help_up
            adb push build-android-emulator-x86_64/sin_android_original_grunt_help_up_task_tests /data/local/tmp/sin_grunt_help_up/sin_android_original_grunt_help_up_task_tests
            adb shell 'cd /data/local/tmp/sin_grunt_help_up && chmod 700 sin_android_original_grunt_help_up_task_tests && ./sin_android_original_grunt_help_up_task_tests' | tr -d '\r' | tee build-android-emulator-x86_64/grunt-help-up-bionic-output.txt
            grep -Fxq 'PASS: original SiN grunt help-up start/update paths and inherited fallback' build-android-emulator-x86_64/grunt-help-up-bionic-output.txt
            # Phase135: run the original hostility-mode condition subset on
            # Android Bionic with a mock host; not SourceVR or Quest gameplay.
            adb shell mkdir -p /data/local/tmp/sin_grunt_relationship
            adb push build-android-emulator-x86_64/sin_android_original_grunt_relationship_tests /data/local/tmp/sin_grunt_relationship/sin_android_original_grunt_relationship_tests
            adb shell 'cd /data/local/tmp/sin_grunt_relationship && chmod 700 sin_android_original_grunt_relationship_tests && ./sin_android_original_grunt_relationship_tests' | tr -d '\r' | tee build-android-emulator-x86_64/grunt-relationship-bionic-output.txt
            grep -Fxq 'PASS: original SiN grunt hostility-mode relation and condition gathering (mock host only)' build-android-emulator-x86_64/grunt-relationship-bionic-output.txt
            # Phase136: execute the original embedded Beserk state model on Bionic with a mock host.
            adb shell mkdir -p /data/local/tmp/sin_grunt_beserk
            adb push build-android-emulator-x86_64/sin_android_original_grunt_beserk_behavior_tests /data/local/tmp/sin_grunt_beserk/sin_android_original_grunt_beserk_behavior_tests
            adb shell 'cd /data/local/tmp/sin_grunt_beserk && chmod 700 sin_android_original_grunt_beserk_behavior_tests && ./sin_android_original_grunt_beserk_behavior_tests' | tr -d '\r' | tee build-android-emulator-x86_64/grunt-beserk-bionic-output.txt
            grep -Fxq 'PASS: original SiN CAI_BeserkBehavior timer, schedule gate and relationship integration (mock host only)' build-android-emulator-x86_64/grunt-beserk-bionic-output.txt
            # Phase137: execute the reconstructed grunt grenade-kick host contract on Bionic.
            adb shell mkdir -p /data/local/tmp/sin_grunt_kick
            adb push build-android-emulator-x86_64/sin_android_original_grunt_kick_tests /data/local/tmp/sin_grunt_kick/sin_android_original_grunt_kick_tests
            adb shell 'cd /data/local/tmp/sin_grunt_kick && chmod 700 sin_android_original_grunt_kick_tests && ./sin_android_original_grunt_kick_tests' | tr -d '\r' | tee build-android-emulator-x86_64/grunt-kick-bionic-output.txt
            grep -Fxq 'PASS: original SiN grunt grenade-kick eligibility, task start and event-3 host contract (mock host only)' build-android-emulator-x86_64/grunt-kick-bionic-output.txt
            # Phase138: execute the reconstructed scene/map-output routing on Android Bionic.
            adb shell mkdir -p /data/local/tmp/sin_scene_io
            adb push build-android-emulator-x86_64/sin_android_original_scene_io_tests /data/local/tmp/sin_scene_io/sin_android_original_scene_io_tests
            adb shell 'cd /data/local/tmp/sin_scene_io && chmod 700 sin_android_original_scene_io_tests && ./sin_android_original_scene_io_tests' | tr -d '\r' | tee build-android-emulator-x86_64/scene-io-bionic-output.txt
            grep -Fxq 'PASS: original SiN choreographed-scene trigger and scripted-sequence output routing (mock host only)' build-android-emulator-x86_64/scene-io-bionic-output.txt
            # Phase139: execute original scene playback input order on Android Bionic.
            adb shell mkdir -p /data/local/tmp/sin_scene_playback
            adb push build-android-emulator-x86_64/sin_android_original_scene_playback_tests /data/local/tmp/sin_scene_playback/sin_android_original_scene_playback_tests
            adb shell 'cd /data/local/tmp/sin_scene_playback && chmod 700 sin_android_original_scene_playback_tests && ./sin_android_original_scene_playback_tests' | tr -d '\r' | tee build-android-emulator-x86_64/scene-playback-bionic-output.txt
            grep -Fxq 'PASS: original CSceneEntity Start/Pause/Resume/Cancel input order (mock host only)' build-android-emulator-x86_64/scene-playback-bionic-output.txt
            # Phase140: execute the original grunt map-input reconstruction on Android Bionic.
            adb shell mkdir -p /data/local/tmp/sin_grunt_map_inputs
            adb push build-android-emulator-x86_64/sin_android_original_grunt_map_inputs_tests /data/local/tmp/sin_grunt_map_inputs/sin_android_original_grunt_map_inputs_tests
            adb shell 'cd /data/local/tmp/sin_grunt_map_inputs && chmod 700 sin_android_original_grunt_map_inputs_tests && ./sin_android_original_grunt_map_inputs_tests' | tr -d '\r' | tee build-android-emulator-x86_64/grunt-map-inputs-bionic-output.txt
            grep -Fxq 'PASS: original SiN grunt map inputs update patrol, look flag, assault dispatch and grenade mode (mock host only)' build-android-emulator-x86_64/grunt-map-inputs-bionic-output.txt
            # Phase141: execute the reconstructed vehicle view/runtime contract on Android Bionic.
            adb shell mkdir -p /data/local/tmp/sin_vehicle_runtime
            adb push build-android-emulator-x86_64/sin_android_original_vehicle_runtime_tests /data/local/tmp/sin_vehicle_runtime/sin_android_original_vehicle_runtime_tests
            adb shell 'cd /data/local/tmp/sin_vehicle_runtime && chmod 700 sin_android_original_vehicle_runtime_tests && ./sin_android_original_vehicle_runtime_tests' | tr -d '\r' | tee build-android-emulator-x86_64/vehicle-runtime-bionic-output.txt
            grep -Fxq 'PASS: original SiN vehicle runtime inputs, view permissions and damage modifier (mock host only)' build-android-emulator-x86_64/vehicle-runtime-bionic-output.txt
      - name: Require actual Android pass evidence
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=build-android-emulator-x86_64/android-runtime-evidence.txt
          test -s "$EVIDENCE"
          grep -qx 'result=PASS' "$EVIDENCE"
          grep -qx 'abi=x86_64' "$EVIDENCE"
          grep -qx 'remote_sha256_verified=true' "$EVIDENCE"
          grep -qx 'loader_marker_verified=true' "$EVIDENCE"
          grep -qx 'scope=standalone_native_abi_not_sourcevr' "$EVIDENCE"
          grep -Fxq 'PASS: native shared-library dlopen + C ABI isolation, error and token translation tests' build-android-emulator-x86_64/phase100-bionic-output.txt
          grep -Fxq 'PASS: Phase101 mock-provider Bionic two-library mapping executed' build-android-emulator-x86_64/phase101-bionic-output.txt
          grep -Fxq 'PASS: Phase102 provider replacement invalidates sound namespace, keyboard survives, epoch guarded' build-android-emulator-x86_64/phase102-bionic-output.txt
          grep -Fxq 'PASS: independently authored SiN JC/Jessica C ABI dlopen, callback guards and scene events (fake host)' build-android-emulator-x86_64/scene-actor-bionic-output.txt
          grep -Fxq 'PASS: independent assault NPC C ABI dlopen with fake host, exclusive rally locks, cue and registered condition callbacks' build-android-emulator-x86_64/assault-npc-bionic-output.txt
          grep -Fxq 'PASS: original ai_goal_assault C ABI fanout across multiple generation-safe mock NPCs and rally ownership' build-android-emulator-x86_64/assault-goal-fanout-bionic-output.txt
          grep -Fxq 'XR_SOURCE_POSE_BIONIC_PASS' build-android-emulator-x86_64/xr-pose-bionic-output.txt
