name: ARM64 Source factory diagnostic
on:
  push:
  pull_request:
jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Android SDK tools
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install pinned Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.2.12479018"
      - name: Build diagnostic factory for ARM64 Android
        run: |
          cmake -S . -B build-android -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DBUILD_TESTING=OFF
          cmake --build build-android --target sin_factory_probe sin_factory_probe_client --parallel
      - name: Verify ELF architecture and factory export
        run: |
          file build-android/libsin_factory_probe.so
          readelf -h build-android/libsin_factory_probe.so | grep -q 'Machine:.*AArch64'
          readelf --dyn-syms --wide build-android/libsin_factory_probe.so |
            grep -q 'CreateInterface'
          readelf --dyn-syms --wide build-android/libsin_factory_probe.so |
            grep -q 'SinFactoryProbeRequestCount'
          file build-android/libclient.so
          readelf -h build-android/libclient.so | grep -q 'Machine:.*AArch64'
          readelf -d build-android/libclient.so | grep -q 'Library soname: \[libclient.so\]'
          readelf --dyn-syms --wide build-android/libclient.so |
            grep -q 'CreateInterface'
      - uses: actions/upload-artifact@v4
        with:
          name: sourcevr-arm64-factory-diagnostic-and-client-selection
          path: |
            build-android/libsin_factory_probe.so
            build-android/libclient.so
          retention-days: 7
          if-no-files-found: error
