name: SiN Phase1726 original CWorld embedded word leaf

on:
  pull_request:
    paths:
      - '.github/workflows/sin-original-client-world-embedded-word-phase1726.yml'
      - 'include/sin_compat/original_client_world_embedded_word_phase1726.hpp'
      - 'tests/test_original_client_world_embedded_word_phase1726.cpp'
      - 'research/tools/audit_sin_original_client_world_embedded_word_phase1726.py'
  workflow_dispatch:

jobs:
  source-schema-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original-free SHA mutation and constructor census
        run: python3 research/tools/audit_sin_original_client_world_embedded_word_phase1726.py --self-test
      - name: Strict GCC + Clang portable original leaf tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_world_embedded_word_phase1726.cpp -o /tmp/sin-phase1726-gcc
          /tmp/sin-phase1726-gcc
          clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_world_embedded_word_phase1726.cpp -o /tmp/sin-phase1726-clang
          /tmp/sin-phase1726-clang
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_original_client_world_embedded_word_phase1726.cpp -o /tmp/sin-phase1726-san
          /tmp/sin-phase1726-san
  native32-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Win32 C++17 verified embedded-word leaf
        shell: cmd
        run: |
          cl /nologo /std:c++17 /W4 /WX /EHsc /Iinclude tests\test_original_client_world_embedded_word_phase1726.cpp /Fe:sin-phase1726.exe
          sin-phase1726.exe
