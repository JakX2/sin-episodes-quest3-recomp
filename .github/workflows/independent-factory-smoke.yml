name: Independent synthetic factory boundary
on:
  pull_request:
    paths:
      - 'research/independent_factory/**'
      - '.github/workflows/independent-factory-smoke.yml'
  workflow_dispatch:
jobs:
  linux-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s research/independent_factory -p 'test_*.py' -v
  windows-win32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build real 32-bit synthetic DLL
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /W4 /WX /LD research\independent_factory\factory.cpp /Fe:factory.dll
      - name: Inspect PE machine and exported factory
        shell: pwsh
        run: |
          $headers = & dumpbin /headers factory.dll | Out-String
          if ($headers -notmatch '14C machine \(x86\)') { throw 'Expected PE32 x86 DLL' }
          $exports = & dumpbin /exports factory.dll | Out-String
          if ($exports -notmatch 'CreateInterface') { throw 'Missing CreateInterface export' }
      - name: Audit independent PE32 static import boundary
        shell: pwsh
        run: |
          python research/independent_factory/audit_pe_imports.py factory.dll --forbid client.dll --forbid server.dll
      - name: Audit PE32 delay imports and forwarded exports
        shell: pwsh
        run: |
          python research/independent_factory/audit_pe_extended.py factory.dll --forbid client.dll --forbid server.dll
      - name: Build native Win32 x86 executable loader
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /W4 /WX research\independent_factory\win32_loader_smoke.cpp /Fe:win32_loader_smoke.exe
      - name: Verify loader executable architecture
        shell: pwsh
        run: |
          $headers = & dumpbin /headers win32_loader_smoke.exe | Out-String
          if ($headers -notmatch '14C machine \(x86\)') { throw 'Expected Win32 x86 loader' }
      - name: Run native independent DLL loader and factory contract
        shell: cmd
        run: win32_loader_smoke.exe factory.dll
      - name: Build separate native x86 vtable-producing DLL and caller
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX /LD research\independent_factory\virtual_factory.cpp /Fe:sin_synthetic_virtual.dll
          cl /nologo /std:c++17 /EHsc /W4 /WX research\independent_factory\win32_virtual_dispatch_smoke.cpp /Fe:win32_virtual_dispatch_smoke.exe
      - name: Verify independently loaded synthetic C++ vtable through MSVC thiscall
        shell: cmd
        run: win32_virtual_dispatch_smoke.exe sin_synthetic_virtual.dll
      - name: Verify virtual dispatch module's PE32 export/import boundary
        shell: pwsh
        run: |
          $headers = & dumpbin /headers sin_synthetic_virtual.dll | Out-String
          if ($headers -notmatch '14C machine \(x86\)') { throw 'Virtual interface DLL must be PE32 x86' }
          $exports = & dumpbin /exports sin_synthetic_virtual.dll | Out-String
          if ($exports -notmatch '\bCreateInterface\b') { throw 'Missing synthetic CreateInterface export' }
          python research/independent_factory/audit_pe_imports.py sin_synthetic_virtual.dll --forbid client.dll --forbid server.dll
          python research/independent_factory/audit_pe_extended.py sin_synthetic_virtual.dll --forbid client.dll --forbid server.dll

      - name: Compile independent x86 lifecycle ABI fixture and executable
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX /LD research\independent_factory\lifecycle_factory.cpp /Fe:sin_synthetic_lifecycle.dll
          cl /nologo /std:c++17 /EHsc /W4 /WX research\independent_factory\win32_lifecycle_smoke.cpp /Fe:win32_lifecycle_smoke.exe
      - name: Run native x86 lifecycle initialization, rollback, callback and shutdown smoke
        shell: cmd
        run: win32_lifecycle_smoke.exe sin_synthetic_lifecycle.dll
      - name: Check independent lifecycle DLL architecture, export and forbidden imports
        shell: pwsh
        run: |
          $headers = & dumpbin /headers sin_synthetic_lifecycle.dll | Out-String
          if ($headers -notmatch '14C machine \(x86\)') { throw 'Lifecycle DLL is not PE32 x86' }
          $exports = & dumpbin /exports sin_synthetic_lifecycle.dll | Out-String
          if ($exports -notmatch '\bCreateInterface\b') { throw 'Lifecycle CreateInterface missing' }
          python research/independent_factory/audit_pe_imports.py sin_synthetic_lifecycle.dll --forbid client.dll --forbid server.dll
          python research/independent_factory/audit_pe_extended.py sin_synthetic_lifecycle.dll --forbid client.dll --forbid server.dll
