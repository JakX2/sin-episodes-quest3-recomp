name: SiN Phase661 retail server system virtual Init chain
on:
  push:
    branches:
      - feature/sin-original-server-six-init-phase661-chat-20261123
  pull_request:
    paths:
      - 'src/original_server_system_init_phase661.cpp'
      - 'include/sin_compat/original_server_system_init_phase661.hpp'
      - 'tests/test_original_server_system_init_phase661.cpp'
      - 'research/tools/audit_original_server_system_init_phase661.py'
      - '.github/workflows/sin-phase661-system-init.yml'
permissions:
  contents: read
jobs:
  phase661-asanz:
    name: Original server Phase660-to-661 virtual Init Clang ASan UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Original-free PE method shape/mutation audit
        run: |
          python3 -m py_compile research/tools/audit_original_server_system_init_phase661.py
          python3 research/tools/audit_original_server_system_init_phase661.py --self-test
      - name: Build original AutoGameSystem registration + four recovered virtual Init methods
        run: |
          clang++ -std=c++17 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude \
            src/original_server_autogamesystem_phase660.cpp \
            src/original_server_system_init_phase661.cpp \
            tests/test_original_server_system_init_phase661.cpp \
            -o /tmp/sin_phase661_sanitized
      - name: Test complete original startup registration and virtual callbacks
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: /tmp/sin_phase661_sanitized
