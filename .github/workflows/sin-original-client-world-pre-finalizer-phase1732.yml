name: SiN Phase1732 CWorld pre-finalizer source snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/sin-original-client-world-pre-finalizer-phase1732.yml'
      - 'include/sin_compat/original_client_world_pre_finalizer_phase1732.hpp'
      - 'tests/test_original_client_world_pre_finalizer_phase1732.cpp'
      - 'research/tools/audit_sin_original_client_world_pre_finalizer_phase1732.py'
  workflow_dispatch:

jobs:
  strict-original-free-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-only native finalizer 414B SHA identity
        run: python3 research/tools/audit_sin_original_client_world_pre_finalizer_phase1732.py --self-test
      - name: Strict GCC + Clang portable C++17 558B pre-finalizer snapshot
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_world_pre_finalizer_phase1732.cpp -o /tmp/sin-phase1732-gcc
          /tmp/sin-phase1732-gcc
          clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_world_pre_finalizer_phase1732.cpp -o /tmp/sin-phase1732-clang
          /tmp/sin-phase1732-clang
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_original_client_world_pre_finalizer_phase1732.cpp -o /tmp/sin-phase1732-san
          /tmp/sin-phase1732-san
  native32-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Run Win32 C++17 original CWorld pre-finalizer snapshot
        shell: cmd
        run: |
          cl /nologo /std:c++17 /W4 /WX /EHsc /Iinclude tests\test_original_client_world_pre_finalizer_phase1732.cpp /Fe:sin-phase1732.exe
          sin-phase1732.exe
