jobs:
  source-schema-owned-memory-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify authored original 191-class source metadata SHA and public synthetic original refusal
        run: |
          python research/tools/audit_sin_original_client_class_registry.py --self-test --catalog research/manifests/original_client_class_catalog_phase1696.tsv
          python research/tools/audit_sin_original_engine_recvtable_registration_ledger.py --self-test
          python research/tools/audit_sin_original_client_member_offsets.py --self-test
          python research/tools/audit_sin_original_client_type4_arrays.py --self-test
          python research/tools/audit_sin_original_client_static_recvprop_names.py --self-test
          python research/tools/audit_sin_original_client_overlay_zero_field.py --self-test
          python research/tools/audit_sin_original_client_source_proxy_catalog.py --self-test
          python research/tools/audit_sin_original_client_standard_string_datatable_proxies.py --self-test
