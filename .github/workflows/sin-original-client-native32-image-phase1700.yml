          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_original_client_custom_beam_speed_proxy.cpp -o /tmp/sin-custom-beam-speed-proxy-san
