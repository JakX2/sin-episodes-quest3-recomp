          /tmp/sin-original-creator-source-map research/manifests/original_client_class_catalog_phase1696.tsv research/manifests/original_client_creator_source_map_phase1716.csv
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_temp_event_static_creators.cpp -o /tmp/sin-original-static-temp-getters
          /tmp/sin-original-static-temp-getters research/manifests/original_client_class_catalog_phase1696.tsv
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_entity_allocation_prologues.cpp -o /tmp/sin-entity-allocation-prologues
