        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_native32_recvtable_image.cpp -o /tmp/sin-native32-owned-image
          /tmp/sin-native32-owned-image research/manifests/original_client_class_catalog_phase1696.tsv
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_static_recvprop_names.cpp -o /tmp/sin-original-client-names
          /tmp/sin-original-client-names research/manifests/original_client_class_catalog_phase1696.tsv research/manifests/original_client_static_recvprops_phase1704.csv
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_standard_recvproxy_host.cpp -o /tmp/sin-standard-recvproxy-host
          /tmp/sin-standard-recvproxy-host
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_standard_recvproxy_router.cpp -o /tmp/sin-standard-recvproxy-router
