          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_original_client_standard_recvproxy_host.cpp -o /tmp/sin-standard-recvproxy-host-san
          /tmp/sin-standard-recvproxy-host-san
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_original_client_standard_recvproxy_router.cpp -o /tmp/sin-standard-recvproxy-router-san
