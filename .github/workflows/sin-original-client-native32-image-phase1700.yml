          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_original_client_entity_allocation_prologues.cpp -o /tmp/sin-entity-allocation-prologues-san
