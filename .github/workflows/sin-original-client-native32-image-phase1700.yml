          /tmp/sin-custom-color-integer-proxy
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_custom_movement_fov_proxies.cpp -o /tmp/sin-custom-movement-fov-proxy
          /tmp/sin-custom-movement-fov-proxy
