name: SiN 2006 PE32 191 ClientClass 1801-property owned-token image

on:
  pull_request:
    paths:
      - "include/sin_compat/original_client_native32_recvtable_manifest.hpp"
      - "include/sin_compat/original_client_native_member_offsets.hpp"
      - "include/sin_compat/original_client_native_type4_array_fields.hpp"
      - "research/manifests/original_client_static_recvprops_phase1704.csv"
      - "research/tools/audit_sin_original_client_static_recvprop_names.py"
      - "research/tools/audit_sin_original_client_overlay_zero_field.py"
      - "tests/test_original_client_static_recvprop_names.cpp"
      - "research/tools/audit_sin_original_client_type4_arrays.py"
      - "research/tools/audit_sin_original_client_member_offsets.py"
      - "research/tools/audit_sin_original_engine_recvtable_registration_ledger.py"
      - "include/sin_compat/original_client_native32_recvtable_image.hpp"
      - "tests/test_original_client_native32_recvtable_image.cpp"
      - ".github/workflows/sin-original-client-native32-image-phase1700.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-schema-owned-memory-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify authored original 191-class source metadata SHA and public synthetic original refusal
        run: |
          python research/tools/audit_sin_original_client_class_registry.py --self-test --catalog research/manifests/original_client_class_catalog_phase1696.tsv
          python research/tools/audit_sin_original_engine_recvtable_registration_ledger.py --self-test
          python research/tools/audit_sin_original_client_member_offsets.py --self-test
          python research/tools/audit_sin_original_client_type4_arrays.py --self-test
          python research/tools/audit_sin_original_client_static_recvprop_names.py --self-test
          python research/tools/audit_sin_original_client_overlay_zero_field.py --self-test
      - name: Strict C++17 compile and run real 2006 source schema in owned token arena
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_native32_recvtable_image.cpp -o /tmp/sin-native32-owned-image
          /tmp/sin-native32-owned-image research/manifests/original_client_class_catalog_phase1696.tsv
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_static_recvprop_names.cpp -o /tmp/sin-original-client-names
          /tmp/sin-original-client-names research/manifests/original_client_class_catalog_phase1696.tsv research/manifests/original_client_static_recvprops_phase1704.csv
      - name: Verify native 32-bit pointer image with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_original_client_native32_recvtable_image.cpp -o /tmp/sin-native32-owned-image-san
          /tmp/sin-native32-owned-image-san research/manifests/original_client_class_catalog_phase1696.tsv
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_original_client_static_recvprop_names.cpp -o /tmp/sin-original-client-names-san
          /tmp/sin-original-client-names-san research/manifests/original_client_class_catalog_phase1696.tsv research/manifests/original_client_static_recvprops_phase1704.csv
