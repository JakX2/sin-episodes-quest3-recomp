          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_source_zero_init_allocator.cpp -o /tmp/sin-source-zero-init-allocation
          /tmp/sin-source-zero-init-allocation research/manifests/original_client_class_catalog_phase1696.tsv
