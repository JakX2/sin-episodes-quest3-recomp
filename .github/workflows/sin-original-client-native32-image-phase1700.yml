          python research/tools/audit_sin_original_client_creator_source_map.py --self-test
          python research/tools/audit_sin_original_client_temp_event_static_creators.py --self-test
          python research/tools/audit_sin_original_client_entity_allocation_prologues.py --self-test
          python research/tools/audit_sin_original_client_zero_init_allocator.py --self-test
          python research/tools/audit_sin_original_client_allocator_dispatch.py --self-test
          python research/tools/audit_sin_original_client_seven_creator_exceptions.py --self-test
          python research/tools/audit_sin_original_client_full_entity_creator_bodies.py --self-test
          python research/tools/audit_sin_original_client_shared_constructor_chain.py --self-test
