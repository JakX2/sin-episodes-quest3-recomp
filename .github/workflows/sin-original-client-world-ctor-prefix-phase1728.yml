name: SiN Phase1728 CWorld native constructor prefix

on:
  pull_request:
    paths:
      - '.github/workflows/sin-original-client-world-ctor-prefix-phase1728.yml'
      - 'include/sin_compat/original_client_world_ctor_prefix_phase1728.hpp'
      - 'tests/test_original_client_world_ctor_prefix_phase1728.cpp'
      - 'research/tools/audit_sin_original_client_world_ctor_prefix_phase1728.py'
  workflow_dispatch:

jobs:
  strict-original-free-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify native source metadata without proprietary binaries
        run: python3 research/tools/audit_sin_original_client_world_ctor_prefix_phase1728.py --self-test
      - name: Strict GCC + Clang portable C++17 constructor snapshots
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_world_ctor_prefix_phase1728.cpp -o /tmp/sin-phase1728-gcc
          /tmp/sin-phase1728-gcc
          clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_world_ctor_prefix_phase1728.cpp -o /tmp/sin-phase1728-clang
          /tmp/sin-phase1728-clang
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_original_client_world_ctor_prefix_phase1728.cpp -o /tmp/sin-phase1728-san
          /tmp/sin-phase1728-san
  native32-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Win32 C++17 inert snapshot (not a retail engine DLL)
        shell: cmd
        run: |
          cl /nologo /std:c++17 /W4 /WX /EHsc /Iinclude tests\test_original_client_world_ctor_prefix_phase1728.cpp /Fe:sin-phase1728.exe
          sin-phase1728.exe
