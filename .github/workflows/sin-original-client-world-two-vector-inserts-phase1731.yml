name: SiN Phase1731 World two source vector append entries

on:
  pull_request:
    paths:
      - '.github/workflows/sin-original-client-world-two-vector-inserts-phase1731.yml'
      - 'include/sin_compat/original_client_world_two_vector_entries_phase1731.hpp'
      - 'tests/test_original_client_world_two_vector_entries_phase1731.cpp'
      - 'research/tools/audit_sin_original_client_world_two_vector_entries_phase1731.py'
  workflow_dispatch:

jobs:
  strict-original-free-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-only native vector helper identities
        run: python3 research/tools/audit_sin_original_client_world_two_vector_entries_phase1731.py --self-test
      - name: Strict GCC + Clang portable C++17 two vector appends
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_world_two_vector_entries_phase1731.cpp -o /tmp/sin-phase1731-gcc
          /tmp/sin-phase1731-gcc
          clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Iinclude tests/test_original_client_world_two_vector_entries_phase1731.cpp -o /tmp/sin-phase1731-clang
          /tmp/sin-phase1731-clang
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude tests/test_original_client_world_two_vector_entries_phase1731.cpp -o /tmp/sin-phase1731-san
          /tmp/sin-phase1731-san
  native32-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Run Win32 C++17 vector allocation source model
        shell: cmd
        run: |
          cl /nologo /std:c++17 /W4 /WX /EHsc /Iinclude tests\test_original_client_world_two_vector_entries_phase1731.cpp /Fe:sin-phase1731.exe
          sin-phase1731.exe
