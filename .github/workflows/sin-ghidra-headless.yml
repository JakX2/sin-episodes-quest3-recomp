name: SiN original DLL Ghidra headless batch atlas

# Retail binaries stay on ephemeral runner disk; PR smoke uses SYNTHETIC ELF.
# Scheduling takes effect ONLY after merging this workflow to default branch.
on:
  pull_request:
    paths:
      - '.github/workflows/sin-ghidra-headless.yml'
      - 'research/tools/install_pinned_ghidra.sh'
      - 'research/tools/stage_original_pe_from_drive_zips.py'
      - 'research/tests/test_stage_original_pe_from_drive_zips.py'
      - 'research/tools/run_ghidra_original.sh'
      - 'research/ghidra/ExportOriginalFunctionAtlas.py'
      - 'research/ghidra/ExportOriginalFunctionAtlas.java'
      - 'research/tools/compare_ghidra_original_atlas.py'
      - 'research/catalog/original_dll_interface_registrations.json'
      - 'research/catalog/original_dll_verified_methods.json'
      - 'research/ghidra/SeedReviewedInterfaceFactories.java'
      - 'research/ghidra/ExportTargetedInterfacePseudocode.java'
      - 'research/tools/summarize_private_ghidra_decomp.py'
      - 'research/tests/test_summarize_private_ghidra_decomp.py'
      - 'research/tests/test_private_ghidra_runner.py'
      - 'research/tools/build_relocated_pointer_table_queue.py'
      - 'research/tests/test_build_relocated_pointer_table_queue.py'
      - 'research/ghidra/RemoveSyntheticFactoryForSmoke.java'
      - 'research/ghidra/ExportReviewedFactoryDataReferences.java'
      - 'research/tools/summarize_factory_data_references.py'
      - 'research/tests/test_summarize_factory_data_references.py'
      - 'research/tools/join_factory_pointer_candidates.py'
      - 'research/tests/test_join_factory_pointer_candidates.py'
      - 'research/tests/test_owner_ghidra_workflow_contract.py'
      - 'research/tools/recover_original_vtable_prefixes.py'
      - 'research/tests/test_recover_original_vtable_prefixes.py'
      - 'research/tools/prepare_reviewed_factory_seeds.py'
      - 'research/tests/test_prepare_reviewed_factory_seeds.py'
      - 'research/tools/build_ghidra_interface_queue.py'
      - 'research/tests/test_build_ghidra_interface_queue.py'
      - 'research/tools/audit_factory_seeds.py'
      - 'research/tests/test_audit_factory_seeds.py'
  workflow_dispatch:
  schedule:
    - cron: '23 2,14 * * *'

permissions:
  contents: read

concurrency:
  group: sin-original-ghidra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-zip-tests:
    name: Synthetic-only original ZIP staging
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests without original game DLLs
        run: |
          python3 -m unittest discover -s research/tests -p 'test_stage_original_pe_from_drive_zips.py' -v
          python3 -m unittest discover -s research/tests -p 'test_compare_ghidra_original_atlas.py' -v
          python3 -m unittest discover -s research/tests -p 'test_prepare_reviewed_factory_seeds.py' -v
          python3 -m unittest discover -s research/tests -p 'test_build_ghidra_interface_queue.py' -v
          python3 -m unittest discover -s research/tests -p 'test_audit_factory_seeds.py' -v
          python3 -m unittest discover -s research/tests -p 'test_summarize_private_ghidra_decomp.py' -v
          python3 -m unittest discover -s research/tests -p 'test_private_ghidra_runner.py' -v
          python3 -m unittest discover -s research/tests -p 'test_build_relocated_pointer_table_queue.py' -v
          python3 -m unittest discover -s research/tests -p 'test_summarize_factory_data_references.py' -v
          python3 -m unittest discover -s research/tests -p 'test_join_factory_pointer_candidates.py' -v
          python3 -m unittest discover -s research/tests -p 'test_owner_ghidra_workflow_contract.py' -v
          python3 -m unittest discover -s research/tests -p 'test_recover_original_vtable_prefixes.py' -v
          bash -n research/tools/install_pinned_ghidra.sh
          bash -n research/tools/run_ghidra_original.sh

  ghidra-headless-smoke:
    name: Actual Ghidra 12.2 headless smoke on synthetic ELF
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ghidra-archive/ghidra_12.2_PUBLIC_20261016.zip
          key: verified-ghidra-12-2-sha256-2c2cd776
      - name: Install pinned SHA256 verified original Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          GHIDRA_HOME="$(bash research/tools/install_pinned_ghidra.sh "$RUNNER_TEMP/ghidra-archive" "$RUNNER_TEMP/ghidra-installed")"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Compile harmless sample and run actual Ghidra postScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sin-ghidra-smoke" "$RUNNER_TEMP/sin-ghidra-project"
          printf '%s\n' 'volatile int synthetic_data=5;' 'int helper(int x) { return x + synthetic_data; }' 'int main(void) { return helper(37) == 42 ? 0 : 1; }' > "$RUNNER_TEMP/sin-ghidra-smoke/synthetic.c"
          cc -no-pie -O0 -fno-inline -o "$RUNNER_TEMP/sin-ghidra-smoke/synthetic" "$RUNNER_TEMP/sin-ghidra-smoke/synthetic.c"
          seed_address="$(nm -n "$RUNNER_TEMP/sin-ghidra-smoke/synthetic" | awk '$3 == "helper" { print $1; exit }')"
          test -n "$seed_address"
          printf '%s\n' 'entry,interface,source' "$seed_address,SyntheticEngine001,reviewed_original_static_registration" > "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_factory_seeds.csv"
          SIN_PRIVATE_DECOMP_ACK=1 "$GHIDRA_HOME/support/analyzeHeadless" "$RUNNER_TEMP/sin-ghidra-project" SyntheticSmoke \
            -import "$RUNNER_TEMP/sin-ghidra-smoke/synthetic" \
            -scriptPath "$GITHUB_WORKSPACE/research/ghidra" \
            -postScript RemoveSyntheticFactoryForSmoke.java "$seed_address" \
            -postScript SeedReviewedInterfaceFactories.java "$RUNNER_TEMP/sin-ghidra-smoke" "$RUNNER_TEMP/sin-ghidra-smoke" \
            -postScript ExportReviewedFactoryDataReferences.java "$RUNNER_TEMP/sin-ghidra-smoke" "$RUNNER_TEMP/sin-ghidra-smoke" \
            -postScript ExportTargetedInterfacePseudocode.java "$RUNNER_TEMP/sin-ghidra-smoke" "$RUNNER_TEMP/sin-ghidra-private" \
            -postScript ExportOriginalFunctionAtlas.java "$RUNNER_TEMP/sin-ghidra-smoke" \
            -deleteProject
          test -s "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_functions.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_callers.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_relocated_code_pointers.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_factory_seed_results.csv"
          grep -q 'SyntheticEngine001' "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_factory_seed_results.csv"
          grep -q 'seeded_candidate' "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_factory_seed_results.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_factory_data_ref_status.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_factory_direct_data_refs.csv"
          grep -q 'SyntheticEngine001' "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_factory_direct_data_refs.csv"
          grep -q '.data' "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_factory_direct_data_refs.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-private/synthetic_targeted_decomp_status.csv"
          grep -q 'decompiled_candidate' "$RUNNER_TEMP/sin-ghidra-private/synthetic_targeted_decomp_status.csv"
          find "$RUNNER_TEMP/sin-ghidra-private/synthetic_PRIVATE_TARGETED_DECOMPILATION" -type f -name 'SyntheticEngine001_*.c' -size +0c | grep -q .
          test ! -e "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_PRIVATE_TARGETED_DECOMPILATION"
          test ! -e "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_PRIVATE_DECOMPILATION"
          # Feed actual Ghidra-generated synthetic pointer metadata through
          # the same candidate-queue CLI, never original game data on PRs.
          for dll in client.dll server.dll; do
            cp "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_relocated_code_pointers.csv" \
              "$RUNNER_TEMP/sin-ghidra-smoke/${dll}_relocated_code_pointers.csv"
          done
          python3 research/tools/build_relocated_pointer_table_queue.py \
            --ghidra-dir "$RUNNER_TEMP/sin-ghidra-smoke" \
            --out "$RUNNER_TEMP/sin-ghidra-smoke/synthetic_relocated_pointer_queue.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) /
              "sin-ghidra-smoke/synthetic_relocated_pointer_queue.json").read_text())
          assert report["schema"] == "sin-relocated-code-pointer-runs-v1"
          assert report["new_verified_original_methods"] == 0
          assert report["original_code_or_pseudocode_included"] is False
          assert set(report["modules"]) == {"client.dll", "server.dll"}
          PY

  analyze-owner-originals:
    name: Original client/server Ghidra metadata using private Drive inputs
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail clearly unless both original Drive IDs are configured
        env:
          DRIVE_BIN_ZIP: ${{ secrets.SIN_ORIGINAL_DRIVE_BIN_ZIP_ID }}
          DRIVE_BIN_1_ZIP: ${{ secrets.SIN_ORIGINAL_DRIVE_BIN_1_ZIP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DRIVE_BIN_ZIP" || -z "$DRIVE_BIN_1_ZIP" ]]; then
            echo "::error::Configure SIN_ORIGINAL_DRIVE_BIN_ZIP_ID and SIN_ORIGINAL_DRIVE_BIN_1_ZIP_ID in repository Actions secrets"
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ghidra-archive/ghidra_12.2_PUBLIC_20261016.zip
          key: verified-ghidra-12-2-sha256-2c2cd776
      - name: Install pinned verified Ghidra 12.2
        run: |
          GHIDRA_HOME="$(bash research/tools/install_pinned_ghidra.sh "$RUNNER_TEMP/ghidra-archive" "$RUNNER_TEMP/ghidra-installed")"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Download two Google Drive ZIPs into ephemeral runner scratch
        env:
          DRIVE_BIN_ZIP: ${{ secrets.SIN_ORIGINAL_DRIVE_BIN_ZIP_ID }}
          DRIVE_BIN_1_ZIP: ${{ secrets.SIN_ORIGINAL_DRIVE_BIN_1_ZIP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'gdown==5.2.0'
          mkdir -p "$RUNNER_TEMP/sin-original-drive-private"
          chmod 700 "$RUNNER_TEMP/sin-original-drive-private"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import gdown
          folder = Path(os.environ["RUNNER_TEMP"]) / "sin-original-drive-private"
          for env, target in (("DRIVE_BIN_ZIP", "bin.zip"), ("DRIVE_BIN_1_ZIP", "bin_1.zip")):
              output = folder / target
              if not gdown.download(id=os.environ[env], output=str(output), quiet=True):
                  raise SystemExit("Drive retrieval failed; check file permissions or quota")
              if not output.is_file():
                  raise SystemExit("Drive retrieval did not create ZIP")
          PY
      - name: Verify original full-file SHA256s and safely stage DLLs
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tools/stage_original_pe_from_drive_zips.py \
            --archive "$RUNNER_TEMP/sin-original-drive-private/bin.zip" \
            --archive "$RUNNER_TEMP/sin-original-drive-private/bin_1.zip" \
            --output-dir "$RUNNER_TEMP/sin-original-pe-private"
      - name: Prepare reviewed interface factory seeds after original SHA256 verification
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tools/prepare_reviewed_factory_seeds.py \
            --manifest research/catalog/original_dll_interface_registrations.json \
            --out-dir "$RUNNER_TEMP/sin-reviewed-factory-seeds"
          test -s "$RUNNER_TEMP/sin-reviewed-factory-seeds/client.dll_factory_seeds.csv"
          test -s "$RUNNER_TEMP/sin-reviewed-factory-seeds/server.dll_factory_seeds.csv"
          echo "SIN_GHIDRA_SEED_DIRECTORY=$RUNNER_TEMP/sin-reviewed-factory-seeds" >> "$GITHUB_ENV"
          echo "SIN_GHIDRA_FACTORY_XREFS=1" >> "$GITHUB_ENV"
      - name: Authorize ephemeral private Ghidra decompilation after authenticated original staging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sin-ghidra-private"
          chmod 700 "$RUNNER_TEMP/sin-ghidra-private"
          echo "SIN_GHIDRA_TARGETED_PRIVATE_DIRECTORY=$RUNNER_TEMP/sin-ghidra-private" >> "$GITHUB_ENV"
          echo "SIN_PRIVATE_DECOMP_ACK=1" >> "$GITHUB_ENV"
      - name: Run real Ghidra headless batch analysis on both owner-original DLLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sin-ghidra-metadata"
          # The runner accepts GHIDRA_HOME, original-bin, metadata-dir,
          # and an optional MODE. Reviewed seeds/private scratch use env.
          bash research/tools/run_ghidra_original.sh "$GHIDRA_HOME" \
            "$RUNNER_TEMP/sin-original-pe-private" "$RUNNER_TEMP/sin-ghidra-metadata"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/client.dll_functions.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/server.dll_functions.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/client.dll_factory_seed_results.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/server.dll_factory_seed_results.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/client.dll_factory_data_ref_status.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/server.dll_factory_data_ref_status.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/client.dll_factory_direct_data_refs.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/server.dll_factory_direct_data_refs.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-private/client.dll_targeted_decomp_status.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-private/server.dll_targeted_decomp_status.csv"
          test ! -d "$RUNNER_TEMP/sin-ghidra-metadata/client.dll_PRIVATE_TARGETED_DECOMPILATION"
          test ! -d "$RUNNER_TEMP/sin-ghidra-metadata/server.dll_PRIVATE_TARGETED_DECOMPILATION"
          test ! -d "$RUNNER_TEMP/sin-ghidra-metadata/client.dll_PRIVATE_DECOMPILATION"
          test ! -d "$RUNNER_TEMP/sin-ghidra-metadata/server.dll_PRIVATE_DECOMPILATION"
      - name: Authenticate owner originals and recover pinned vtable pointer prefixes
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tools/recover_original_vtable_prefixes.py \
            --original-dir "$RUNNER_TEMP/sin-original-pe-private" \
            --ghidra-dir "$RUNNER_TEMP/sin-ghidra-metadata" \
            --out-dir "$RUNNER_TEMP/sin-ghidra-metadata"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/original_vtable_prefix_review.json"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/client.dll_vtable_method_seeds.csv"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/server.dll_vtable_method_seeds.csv"
      - name: Separate Ghidra inferred functions from SHA-reviewed methods
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tools/compare_ghidra_original_atlas.py \
            --ghidra-dir "$RUNNER_TEMP/sin-ghidra-metadata" \
            --catalog research/catalog/original_dll_verified_methods.json \
            --out "$RUNNER_TEMP/sin-ghidra-metadata/verified_coverage_summary.json"
      - name: Audit reviewed interface factory seeds without promoting inferred methods
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tools/audit_factory_seeds.py \
            --seed-dir "$RUNNER_TEMP/sin-reviewed-factory-seeds" \
            --result-dir "$RUNNER_TEMP/sin-ghidra-metadata" \
            --out "$RUNNER_TEMP/sin-ghidra-metadata/reviewed_factory_seed_audit.json"
      - name: Generate prioritized Source engine interface factory review queue
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tools/build_ghidra_interface_queue.py \
            --ghidra-dir "$RUNNER_TEMP/sin-ghidra-metadata" \
            --manifest research/catalog/original_dll_interface_registrations.json \
            --out "$RUNNER_TEMP/sin-ghidra-metadata/interface_factory_review_queue.json"
      - name: Sanitize and summarize only private decompilation outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tools/summarize_private_ghidra_decomp.py \
            --seed-dir "$RUNNER_TEMP/sin-reviewed-factory-seeds" \
            --status-dir "$RUNNER_TEMP/sin-ghidra-private" \
            --out "$RUNNER_TEMP/sin-ghidra-metadata/private_targeted_decomp_summary.json"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/private_targeted_decomp_summary.json"
      - name: Mine relocated read-only code pointer runs for manual vtable triage
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tools/build_relocated_pointer_table_queue.py \
            --ghidra-dir "$RUNNER_TEMP/sin-ghidra-metadata" \
            --out "$RUNNER_TEMP/sin-ghidra-metadata/relocated_pointer_table_review_queue.json"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/relocated_pointer_table_review_queue.json"
      - name: Reconcile reviewed factory data references for ABI object triage
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tools/summarize_factory_data_references.py \
            --seed-dir "$RUNNER_TEMP/sin-reviewed-factory-seeds" \
            --data-dir "$RUNNER_TEMP/sin-ghidra-metadata" \
            --out "$RUNNER_TEMP/sin-ghidra-metadata/factory_global_data_reference_review.json"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/factory_global_data_reference_review.json"
      - name: Join exact factory data references to read-only pointer candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tools/join_factory_pointer_candidates.py \
            --seed-dir "$RUNNER_TEMP/sin-reviewed-factory-seeds" \
            --data-dir "$RUNNER_TEMP/sin-ghidra-metadata" \
            --out "$RUNNER_TEMP/sin-ghidra-metadata/factory_pointer_run_overlap_review.json"
          test -s "$RUNNER_TEMP/sin-ghidra-metadata/factory_pointer_run_overlap_review.json"
      - name: Upload metadata only (NEVER game binaries or pseudocode)
        uses: actions/upload-artifact@v4
        with:
          name: sin-ghidra-12-2-atlas-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sin-ghidra-metadata/*.csv
            ${{ runner.temp }}/sin-ghidra-metadata/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove private originals and generated analysis from runner scratch
        if: always()
        run: |
          # Original DLLs, seeded metadata and private pseudocode are all
          # runner-only scratch; never retain on failure or completion.
          rm -rf -- "$RUNNER_TEMP/sin-original-drive-private" \
            "$RUNNER_TEMP/sin-original-pe-private" \
            "$RUNNER_TEMP/sin-ghidra-metadata" \
            "$RUNNER_TEMP/sin-reviewed-factory-seeds" \
            "$RUNNER_TEMP/sin-ghidra-private"
