jobs:
  synthetic-decomp-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original client/server rifle factory and firing-path decoder
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_rifle_client_server_registration.py' -v
      - name: Verify original MobGrunt datamap and input-handler decoder
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_original_mobgrunt_datamap.py' -v
      - name: Verify original MobGrunt assault rally point and conditional tuning
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_mobgrunt_assault_rally_timing.py' -v
      - name: Audit original rally lock/unlock and assault-point transition instructions
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_rally_lock_assault_link.py' -v
      - name: Audit original AssaultBehavior diversion RTTI, conditions and SDK configuration
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_assault_diversion.py' -v
      - name: Verify nine original assault schedule task sequences and interrupts
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_assault_schedule_scripts.py' -v
      - name: Verify original SiN native assault task IDs and virtual dispatch registration
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_native_assault_task_ids.py' -v
      - name: Verify original SiN assault task-execution control-flow and OnArrival data paths
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_assault_task_execution.py' -v
      - name: Audit original AssaultCue five-case switch and fixed decisecond NPC deadline
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_assault_cue_wait.py' -v
      - name: Verify original goal BeginAssault actor fanout and received-cue input
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_goal_assault_begin_input.py' -v
      - name: Verify original Source condition symbols IDs and assault callsites
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_assault_condition_registry.py' -v
      - name: Verify CStatAdvisor ownership of non-assault cue-4 lookalike
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_assault_cue4_provenance.py' -v
      - name: Verify original assault SetParameters three cue-state paths
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_assault_setparameters_outcomes.py' -v
      - name: Audit SourceVR ARM64 registered client/server game factory paths (synthetic only)
        run: python -m unittest discover -s research/tests -p 'test_audit_sourcevr_native_game_factories.py' -v
      - name: Verify seven SourceVR native game module loader paths, version floor and real dlsym (synthetic only)
        run: python -m unittest discover -s research/tests -p 'test_audit_sourcevr_engine_module_loader.py' -v
      - name: Check original SiN assault BSP graph routing
        run: python -m unittest discover -s research/tests -p 'test_analyze_sin_assault_graph.py' -v
      - name: Verify original Druglab class RTTI and vtable constructors
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_original_druglab_vtables.py' -v
      - name: Compare original MobGrunt and Elite virtual method overrides
        run: python -m unittest discover -s research/tests -p 'test_audit_sin_original_druglab_vtable_diff.py' -v
